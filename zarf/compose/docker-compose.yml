services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${PLANNER_DB_PASSWORD:-planner}
      POSTGRES_DB: planner
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.planner
    ports:
      - "127.0.0.1:8081:8080"
      - "0.0.0.0:25:2525"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PLANNER_DB_HOST: db
      PLANNER_DB_PORT: 5432
      PLANNER_DB_USER: planner
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD:-planner}
      PLANNER_DB_NAME: planner
      PLANNER_DB_DISABLE_TLS: "true"
      PLANNER_AUTH_API_KEY: "${PLANNER_API_KEY:-devkey123}"
      PLANNER_SMTP_ENABLED: "${PLANNER_SMTP_ENABLED:-false}"
      PLANNER_SMTP_ADDR: ":2525"
      PLANNER_SMTP_DOMAIN: "${PLANNER_SMTP_DOMAIN:-localhost}"
      PLANNER_CLAUDE_CLI_PATH: "${PLANNER_CLAUDE_CLI_PATH:-claude}"
      PLANNER_CLAUDE_MODELS: "${PLANNER_CLAUDE_MODELS:-haiku,sonnet,opus}"
    volumes:
      - "${HOME}/.claude:/home/planner/.claude:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.planner
    command: ["/service/frontend"]
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PLANNER_FRONTEND_BACKEND: "http://backend:8080"
      PLANNER_AUTH_API_KEY: "${PLANNER_API_KEY:-devkey123}"
      PLANNER_AUTH_PASSWORD: "${PLANNER_AUTH_PASSWORD:-}"
    restart: unless-stopped

volumes:
  pgdata:

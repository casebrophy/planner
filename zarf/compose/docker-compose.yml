services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${PLANNER_DB_PASSWORD}
      POSTGRES_DB: planner
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.planner
    ports:
      - "127.0.0.1:8081:8080"
      - "0.0.0.0:2525:2525"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      PLANNER_DB_HOST: db
      PLANNER_DB_PORT: 5432
      PLANNER_DB_USER: planner
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD}
      PLANNER_DB_NAME: planner
      PLANNER_DB_DISABLE_TLS: "true"
      PLANNER_AUTH_API_KEY: ${PLANNER_API_KEY}
      PLANNER_SMTP_ENABLED: "${PLANNER_SMTP_ENABLED:-false}"
      PLANNER_SMTP_ADDR: ":2525"
      PLANNER_SMTP_DOMAIN: "${PLANNER_SMTP_DOMAIN:-localhost}"
      PLANNER_CLAUDE_CLI_PATH: "${PLANNER_CLAUDE_CLI_PATH:-claude}"
      PLANNER_CLAUDE_MODELS: "${PLANNER_CLAUDE_MODELS:-haiku,sonnet,opus}"
      PLANNER_SIDECAR_URL: "http://host.docker.internal:9090"
    volumes:
      - "${HOME}/.claude:/home/planner/.claude:ro"
      - "${HOME}/.claude.json:/home/planner/.claude.json:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: zarf/docker/Dockerfile.planner
    command: ["/service/frontend"]
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PLANNER_FRONTEND_BACKEND: "http://backend:8080"
      PLANNER_AUTH_API_KEY: ${PLANNER_API_KEY}
      PLANNER_AUTH_PASSWORD: ${PLANNER_AUTH_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: planner-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  pgdata:
  ollama-data:

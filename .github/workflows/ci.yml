name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - run: go mod download

      - name: Go lint
        run: make lint

      - name: Go build
        run: go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/services/frontend/web/package-lock.json

      - name: Frontend lint and build
        run: cd api/services/frontend/web && npm ci && npm run lint && npm run build
